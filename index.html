<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Hội Thoại Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .highlight-vocab { background-color: #fef08a; border-bottom: 2px solid #eab308; cursor: pointer; font-weight: 500; }
        .highlight-grammar { background-color: #bfdbfe; border-bottom: 2px solid #3b82f6; cursor: pointer; font-weight: 500; }
        .highlight-vocab:hover { background-color: #fde047; }
        .highlight-grammar:hover { background-color: #93c5fd; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800"><i class="fa-solid fa-language text-blue-600 mr-2"></i>Hệ Thống Luyện Hội Thoại Thông Minh</h1>
            <p class="text-gray-500 mt-2">Nhập hội thoại, tự động phân tích từ vựng, ngữ pháp và luyện nghe/nói Roleplay</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nhập đoạn hội thoại tiếng Anh của bạn:</label>
                    <textarea id="textInput" class="w-full h-40 p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none mb-4 text-gray-700" placeholder="Nam: Hi Lan! I have been looking forward to meeting you.&#10;Lan: Hi Nam! Wow, you look so smart today."></textarea>
                    
                    <div class="flex flex-wrap gap-3">
                        <button onclick="processDialogue()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl transition flex items-center shadow-sm">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Phân tích & Tạo Audio
                        </button>
                        <button id="btnRoleplay" onclick="toggleRoleplayMode()" class="bg-slate-700 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl transition flex items-center shadow-sm hidden">
                            <i class="fa-solid fa-user-friends mr-2"></i> Kích hoạt Roleplay
                        </button>
                    </div>
                </div>

                <div id="dialogueContainer" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hidden">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center">
                            <i class="fa-solid fa-comments text-emerald-500 mr-2"></i> Kịch Bản Hội Thoại
                        </h2>
                        <div id="roleplaySelector" class="hidden flex items-center gap-2">
                            <span class="text-xs font-medium text-gray-500">Ẩn giọng của:</span>
                            <select id="hiddenCharacter" onchange="applyRoleplay()" class="text-sm border border-gray-200 rounded-lg p-1 bg-gray-50 text-gray-700 focus:outline-none"></select>
                        </div>
                    </div>
                    <div id="scriptContent" class="space-y-4"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-amber-600 flex items-center mb-4 border-b border-gray-100 pb-2">
                        <i class="fa-solid fa-book-open mr-2"></i> Từ Vựng Mở Rộng
                    </h2>
                    <div id="vocabList" class="space-y-4 max-h-[300px] overflow-y-auto pr-1">
                        <p class="text-sm text-gray-400 italic">Nhập hội thoại để phân tích từ vựng...</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-blue-600 flex items-center mb-4 border-b border-gray-100 pb-2">
                        <i class="fa-solid fa-graduation-cap mr-2"></i> Cấu Trúc Ngữ Pháp
                    </h2>
                    <div id="grammarList" class="space-y-4 max-h-[350px] overflow-y-auto pr-1">
                        <p class="text-sm text-gray-400 italic">Nhập hội thoại để phân tích ngữ pháp...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU MẪU ĐỂ TRA CỨU (DATABASE MÔ PHỎNG) ---
        // Bạn có thể dễ dàng thêm từ vựng hoặc cấu trúc mới vào đây
        const database = {
            vocab: {
                "looking forward to": { IPA: "/ˈlʊkɪŋ ˈfɔːrwərd tuː/", type: "Phrasal Verb", mean: "Mong đợi, mong chờ", ex: "I am looking forward to holiday.", ex_audio: "I am looking forward to holiday." },
                "smart": { IPA: "/smɑːrt/", type: "Adjective", mean: "Bảnh bao, lịch sự / Thông minh", ex: "You look very smart in that suit.", ex_audio: "You look very smart in that suit." }
            },
            grammar: {
                "looking forward to": { name: "Look forward to", formula: "S + look forward to + V-ing/Noun", ex: "We look forward to hearing from you.", ex_audio: "We look forward to hearing from you." },
                "have been looking forward to": { name: "Present Perfect Continuous", formula: "S + have/has + been + V-ing", ex: "She has been working here for 5 years.", ex_audio: "She has been working here for five years." }
            }
        };

        let characters = [];
        let isRoleplayMode = false;

        // --- CẤU HÌNH PHÁT ÂM THANH (WEB SPEECH API) ---
        function speak(text, voiceType = 'male') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Dừng âm thanh đang phát trước đó
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                
                // Lấy danh sách giọng đọc của hệ thống
                const voices = window.speechSynthesis.getVoices();
                
                // Phân bổ giọng đọc thô sơ dựa trên trình duyệt hỗ trợ
                if (voiceType === 'female') {
                    // Ưu tiên giọng nữ Google hoặc Zira (Microsoft)
                    const femaleVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Zira') || v.name.includes('Samantha'));
                    if (femaleVoice) utterance.voice = femaleVoice;
                    utterance.pitch = 1.1;
                } else {
                    // Ưu tiên giọng nam David hoặc Google UK Male
                    const maleVoice = voices.find(v => v.name.includes('David') || v.name.includes('Google UK Male'));
                    if (maleVoice) utterance.voice = maleVoice;
                    utterance.pitch = 0.9;
                }
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ phát âm thanh miễn phí!");
            }
        }

        // Tải trước voices (Cần thiết cho một số trình duyệt như Chrome)
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        // --- HÀM XỬ LÝ CHÍNH KHI BẤM NÚT PHÂN TÍCH ---
        function processDialogue() {
            const rawText = document.getElementById('textInput').value.trim();
            if (!rawText) return alert("Vui lòng nhập đoạn hội thoại!");

            const lines = rawText.split('\n');
            const container = document.getElementById('scriptContent');
            container.innerHTML = '';
            characters = [];

            let foundVocabs = new Set();
            let foundGrammars = new Set();

            lines.forEach((line, index) => {
                if (!line.includes(':')) return;

                // Phân tách Tên nhân vật và Lời thoại
                let [charName, ...speechParts] = line.split(':');
                charName = charName.trim();
                let speech = speechParts.join(':').trim();

                if (!characters.includes(charName)) characters.push(charName);
                
                // Gán giọng đọc: Nhân vật số 1 giọng Nam, số 2 giọng Nữ, quay vòng...
                const voiceType = characters.indexOf(charName) % 2 === 0 ? 'male' : 'female';

                // Tiến hành Highlight từ vựng và ngữ pháp có trong Database
                let highlightedSpeech = speech;
                
                // Kiểm tra Ngữ Pháp trước (để tránh bị đè do cụm dài hơn)
                Object.keys(database.grammar).forEach(key => {
                    if (speech.toLowerCase().includes(key.toLowerCase())) {
                        foundGrammars.add(key);
                        const regex = new RegExp(`(${key})`, 'gi');
                        highlightedSpeech = highlightedSpeech.replace(regex, `<span class="highlight-grammar" onclick="event.stopPropagation(); speak('${speech.replace(/'/g, "\\'")}', '${voiceType}')">$1</span>`);
                    }
                });

                // Kiểm tra Từ Vựng
                Object.keys(database.vocab).forEach(key => {
                    if (speech.toLowerCase().includes(key.toLowerCase())) {
                        foundVocabs.add(key);
                        const regex = new RegExp(`\\b(${key})\\b`, 'gi');
                        // Nếu chưa được bọc bởi class ngữ pháp thì bọc từ vựng
                        if (!highlightedSpeech.includes('highlight-grammar')) {
                            highlightedSpeech = highlightedSpeech.replace(regex, `<span class="highlight-vocab" onclick="event.stopPropagation(); speak('${speech.replace(/'/g, "\\'")}', '${voiceType}')">$1</span>`);
                        }
                    }
                });

                // Tạo cấu trúc giao diện dòng thoại
                const lineId = `line-${index}`;
                const row = document.createElement('div');
                row.className = `dialogue-line p-3 rounded-xl transition flex items-start gap-3 bg-gray-50 border border-gray-100 hover:bg-gray-100 cursor-pointer`;
                row.setAttribute('data-character', charName);
                row.setAttribute('onclick', `speak(\`${speech.replace(/`/g, "\\`").replace(/\$/g, "\\$")}\`, '${voiceType}')`);
                
                row.innerHTML = `
                    <div class="flex-shrink-0 w-24 font-bold ${voiceType === 'male' ? 'text-blue-600' : 'text-pink-600'} truncate" title="${charName}">
                        <i class="fa-solid ${voiceType === 'male' ? 'fa-user-astronaut' : 'fa-user-ninja'} mr-1 text-xs"></i>${charName}
                    </div>
                    <div class="flex-grow text-gray-700 font-normal speech-text">${highlightedSpeech}</div>
                    <button class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-volume-high"></i></button>
                `;
                container.appendChild(row);
            });

            // Cập nhật giao diện thông tin bên phải
            renderSidebarData(foundVocabs, foundGrammars);

            // Cập nhật bộ chọn Roleplay
            updateRoleplayDropdown();

            // Hiển thị container
            document.getElementById('dialogueContainer').classList.remove('hidden');
            document.getElementById('btnRoleplay').classList.remove('hidden');
        }

        // --- HÀM RENDERING SIDEBAR BÊN PHẢI ---
        function renderSidebarData(vocabs, grammars) {
            const vocabList = document.getElementById('vocabList');
            const grammarList = document.getElementById('grammarList');

            // Render Từ Vựng
            vocabList.innerHTML = '';
            if (vocabs.size === 0) {
                vocabList.innerHTML = '<p class="text-sm text-gray-400 italic">Không tìm thấy từ vựng tiêu biểu.</p>';
            } else {
                vocabs.forEach(key => {
                    const item = database.vocab[key];
                    vocabList.innerHTML += `
                        <div class="p-3 bg-amber-50/50 border border-amber-100 rounded-xl space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-amber-800">${key}</span>
                                <span class="text-xs font-semibold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">${item.type}</span>
                            </div>
                            <p class="text-xs text-gray-500 font-mono">${item.IPA}</p>
                            <p class="text-sm text-gray-700 font-medium">${item.mean}</p>
                            <div class="text-xs text-gray-600 border-l-2 border-amber-300 pl-2 mt-1 flex justify-between items-center">
                                <span class="italic">Ex: ${item.ex}</span>
                                <button onclick="speak('${item.ex_audio}', 'male')" class="text-amber-600 hover:text-amber-800 ml-1"><i class="fa-solid fa-volume-low"></i></button>
                            </div>
                        </div>
                    `;
                });
            }

            // Render Ngữ Pháp
            grammarList.innerHTML = '';
            if (grammars.size === 0) {
                grammarList.innerHTML = '<p class="text-sm text-gray-400 italic">Không tìm thấy cấu trúc cấu trúc ngữ pháp đặc biệt.</p>';
            } else {
                grammars.forEach(key => {
                    const item = database.grammar[key];
                    grammarList.innerHTML += `
                        <div class="p-3 bg-blue-50/50 border border-blue-100 rounded-xl space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-blue-900">${item.name}</span>
                                <button onclick="speak('${item.name}', 'male')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-full w-6 h-6 flex items-center justify-center transition shadow-sm" title="Nghe cách đọc tên cấu trúc">
                                    <i class="fa-solid fa-volume-high text-xs"></i>
                                </button>
                            </div>
                            <p class="text-xs bg-white px-2 py-1 rounded border border-blue-100 font-mono text-blue-700">Formula: ${item.formula}</p>
                            <div class="text-xs text-gray-600 border-l-2 border-blue-300 pl-2 mt-1 flex justify-between items-center">
                                <span class="italic">Ex: ${item.ex}</span>
                                <button onclick="speak('${item.ex_audio}', 'male')" class="text-blue-600 hover:text-blue-800 ml-1"><i class="fa-solid fa-volume-low"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // --- HỆ THỐNG ROLEPLAY THÔNG MINH ---
        function updateRoleplayDropdown() {
            const select = document.getElementById('hiddenCharacter');
            select.innerHTML = '<option value="">-- Chọn nhân vật đóng vai --</option>';
            characters.forEach(char => {
                select.innerHTML += `<option value="${char}">${char}</option>`;
            });
        }

        function toggleRoleplayMode() {
            isRoleplayMode = !isRoleplayMode;
            const btn = document.getElementById('btnRoleplay');
            const selector = document.getElementById('roleplaySelector');
            
            if (isRoleplayMode) {
                btn.innerHTML = `<i class="fa-solid fa-eye mr-2"></i> Tắt chế độ Roleplay`;
                btn.className = "bg-red-600 hover:bg-red-700 text-white font-medium px-5 py-2.5 rounded-xl transition flex items-center shadow-sm";
                selector.classList.remove('hidden');
            } else {
                btn.innerHTML = `<i class="fa-solid fa-user-friends mr-2"></i> Kích hoạt Roleplay`;
                btn.className = "bg-slate-700 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl transition flex items-center shadow-sm";
                selector.classList.add('hidden');
                document.getElementById('hiddenCharacter').value = "";
                applyRoleplay();
            }
        }

        function applyRoleplay() {
            const hiddenChar = document.getElementById('hiddenCharacter').value;
            const lines = document.querySelectorAll('.dialogue-line');

            lines.forEach(line => {
                const char = line.getAttribute('data-character');
                const textNode = line.querySelector('.speech-text');
                
                if (hiddenChar && char === hiddenChar) {
                    // Ẩn chữ bằng hiệu ứng mờ/dấu chấm để người dùng tự nói
                    textNode.style.opacity = "0.15";
                    textNode.style.filter = "blur(2px)";
                } else {
                    // Hiện lại bình thường
                    textNode.style.opacity = "1";
                    textNode.style.filter = "none";
                }
            });
        }
    </script>
</body>
</html>
