<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh Thông Minh</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --highlight-vocab: #fef08a;
            --highlight-grammar: #bfdbfe;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: var(--primary); }
        .input-section {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4338ca; }
        
        /* Kết quả phân tích */
        .output-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .output-section { grid-template-columns: 1fr; }
        }
        .panel {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        
        /* Highlight hiệu ứng */
        .interactive-text {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .hl-v { background-color: var(--highlight-vocab); padding: 2px 4px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .hl-g { background-color: var(--highlight-grammar); padding: 2px 4px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        
        /* Chi tiết từ vựng/ngữ pháp */
        .item-detail {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
        }
        .item-detail:last-child { border-bottom: none; }
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-left: 5px;
        }
        .formula {
            background: #f1f5f9;
            padding: 4px 8px;
            border-left: 4px solid var(--primary);
            font-family: monospace;
            display: inline-block;
            margin: 5px 0;
        }
        .loading { display: none; text-align: center; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 Trợ Lý Phân Tích Hội Thoại Tiếng Anh</h1>
    
    <div class="input-section">
        <label for="apiKey" style="font-weight: bold;">Gemini API Key của bạn:</label>
        <input type="password" id="apiKey" placeholder="Dán API Key vào đây..." style="width: 100%; padding: 8px; margin: 8px 0 15px 0; border-radius: 6px; border: 1px solid #cbd5e1;">
        
        <label for="inputText" style="font-weight: bold;">Nhập đoạn hội thoại tiếng Anh:</label>
        <textarea id="inputText" placeholder="Ví dụ: A: Hello! How are you doing?&#10;B: I'm great. I am looking forward to meeting you."></textarea>
        <button class="btn" onclick="analyzeText()">Phân Tích & Phát Audio Toàn Bài</button>
    </div>

    <div class="loading" id="loading">🔄 Đang phân tích dữ liệu, vui lòng chờ trong giây lát...</div>

    <div class="output-section" id="outputArea" style="display: none;">
        <div class="panel">
            <h3>📝 Đoạn hội thoại gốc (Bấm vào từ/cụm màu để xem nhanh)</h3>
            <div class="interactive-text" id="highlightedText"></div>
        </div>
        
        <div class="panel">
            <h3>📚 Chi tiết Phân tích</h3>
            <div id="detailsContent"></div>
        </div>
    </div>
</div>

<script>
    let globalData = null;

    // Hàm phát âm thanh (Sử dụng Web Speech API miễn phí của Trình duyệt)
    function speak(text, lang = 'en-US') {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Dừng âm thanh cũ nếu đang phát
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Trình duyệt của bạn không hỗ trợ phát âm thanh.");
        }
    }

    // Hàm gọi API Gemini để phân tích cấu trúc
    async function analyzeText() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('inputText').value.trim();
        
        if (!apiKey) return alert("Vui lòng nhập Gemini API Key!");
        if (!text) return alert("Vui lòng nhập đoạn hội thoại!");

        document.getElementById('loading').style.display = 'block';
        document.getElementById('outputArea').style.display = 'none';

        // Đọc toàn bộ đoạn hội thoại bằng giọng Anh-Mỹ trước
        speak(text, 'en-US');

        // Tạo prompt chuẩn định dạng JSON để xử lý dữ liệu dễ dàng
        const prompt = `Bạn là một chuyên gia ngôn ngữ. Hãy phân tích đoạn hội thoại tiếng Anh sau đây: "${text}".
        Hãy tìm ra các từ vựng quan trọng và cấu trúc ngữ pháp có trong bài.
        Trả về kết quả HOÀN TOÀN bằng định dạng JSON (không kèm markdown \`\`\`json ở đầu và cuối), cấu trúc như sau:
        {
          "annotated_text": "Đoạn văn bản gốc nhưng các từ vựng cần học bọc trong thẻ <span class='hl-v' data-id='v1'>từ</span>, cấu trúc ngữ pháp bọc trong thẻ <span class='hl-g' data-id='g1'>cụm cấu trúc</span>. Hãy gán id tăng dần v1, v2... g1, g2...",
          "vocabulary": [
            {"id": "v1", "word": "từ_gốc", "ipa": "phiên_âm", "type": "từ_loại", "meaning": "nghĩa_tiếng_việt", "example": "câu_ví_dụ_tiếng_anh"}
          ],
          "grammar": [
            {"id": "g1", "name": "tên_ngữ_pháp", "formula": "công_thức", "meaning": "giải_thích_nghĩa", "example": "câu_ví_dụ_tiếng_anh"}
          ]
        }`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const result = await response.json();
            let rawText = result.candidates[0].content.parts[0].text;
            
            // Làm sạch dữ liệu JSON phòng trường hợp AI tự thêm tag markdown
            rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
            
            globalData = JSON.parse(rawText);
            renderResult(globalData);

        } catch (error) {
            console.error(error);
            alert("Có lỗi xảy ra khi phân tích dữ liệu. Hãy kiểm tra API Key hoặc format văn bản.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // Hàm hiển thị dữ liệu lên giao diện
    function renderResult(data) {
        document.getElementById('outputArea').style.display = 'grid';
        
        // 1. Hiển thị văn bản highlight
        document.getElementById('highlightedText').innerHTML = data.annotated_text;

        // 2. Gom và Render chi tiết từ vựng + ngữ pháp sang cột phải
        let htmlDetails = `<h4>⭐ TỪ VỰNG CẦN CHÚ Ý</h4>`;
        
        data.vocabulary.forEach(v => {
            htmlDetails += `
                <div class="item-detail" id="detail-${v.id}">
                    <strong>${v.word}</strong> <small style="color:#64748b;">(${v.type})</small> 
                    <span style="color:#2563eb;">${v.ipa}</span>: <span>${v.meaning}</span>
                    <button class="audio-btn" onclick="speak('${v.word}')">🔊 Từ</button>
                    <div style="margin-top:5px; font-style: italic; color:#475569;">
                        Ex: ${v.example} <button class="audio-btn" onclick="speak('${v.example.replace(/'/g, "\\'")}')">🔊 Câu</button>
                    </div>
                </div>
            `;
        });

        htmlDetails += `<h4 style="margin-top:30px;">⭐ CẤU TRÚC NGỮ PHÁP</h4>`;
        data.grammar.forEach(g => {
            htmlDetails += `
                <div class="item-detail" id="detail-${g.id}">
                    <strong>${g.name}</strong> - <span>${g.meaning}</span><br>
                    <div class="formula">Công thức: ${g.formula}</div>
                    <div style="margin-top:5px; font-style: italic; color:#475569;">
                        Ex: ${g.example} <button class="audio-btn" onclick="speak('${g.example.replace(/'/g, "\\'")}')">🔊 Câu</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('detailsContent').innerHTML = htmlDetails;

        // 3. Thêm sự kiện click trực tiếp vào từ được highlight trong đoạn văn
        document.querySelectorAll('.hl-v, .hl-g').forEach(element => {
            element.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const target = document.getElementById(`detail-${id}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.style.backgroundColor = '#fef08a';
                    setTimeout(() => target.style.backgroundColor = 'transparent', 2000);
                    
                    // Tự động đọc từ hoặc câu ví dụ của mục đó khi click vào highlight
                    const item = data.vocabulary.find(v => v.id === id) || data.grammar.find(g => g.id === id);
                    if(item) speak(item.word || item.example);
                }
            });
        });
    }
</script>

</body>
</html>
