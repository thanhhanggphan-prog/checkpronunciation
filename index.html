<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Roleplay & Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #10b981;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --v-color: #fbbf24;
            --g-color: #60a5fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Header & Config */
        .header { text-align: center; margin-bottom: 30px; }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, input, textarea {
            width: 100%; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }

        /* Input Section */
        .input-section { margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; transition: 0.3s; color: white;
        }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Main Display Area */
        .main-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        .panel { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* Context Image */
        #contextImageContainer {
            width: 100%; height: 200px; border-radius: 12px;
            margin-bottom: 20px; overflow: hidden; display: none;
            border: 1px solid #e5e7eb;
        }
        #contextImageContainer img { width: 100%; height: 100%; object-fit: cover; }

        /* Dialogue & Roleplay */
        .dialogue-line {
            margin-bottom: 15px; padding: 12px; border-radius: 10px;
            background: #f9fafb; border-left: 4px solid #e5e7eb;
            transition: 0.3s; cursor: pointer;
        }
        .dialogue-line.active { border-left-color: var(--primary); background: #eef2ff; }
        .dialogue-line.user-role { border-left-color: var(--secondary); background: #f0fdf4; }
        .speaker-name { font-weight: 700; color: var(--primary); display: block; margin-bottom: 4px; }

        /* Highlights */
        .hl-v { background: var(--v-color); color: #000; padding: 0 4px; border-radius: 4px; cursor: help; }
        .hl-g { background: var(--g-color); color: #fff; padding: 0 4px; border-radius: 4px; cursor: help; }

        /* Analysis Details */
        .detail-card {
            border: 1px solid #e5e7eb; border-radius: 10px;
            padding: 15px; margin-bottom: 10px;
        }
        .formula { display: inline-block; background: #f3f4f6; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 13px; }

        .loading { display: none; text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-headset"></i> English Roleplay & Analysis</h1>
        <p>Học qua hội thoại, đóng vai và phân tích ngữ pháp thông minh</p>
    </div>

    <div class="config-grid">
        <div>
            <label><i class="fa-solid fa-key"></i> Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Dán API Key tại đây...">
        </div>
        <div>
            <label><i class="fa-solid fa-microphone-lines"></i> Giọng đọc máy:</label>
            <select id="voiceSelect"><option>Đang tải giọng đọc...</option></select>
        </div>
        <div>
            <label><i class="fa-solid fa-user-tag"></i> Vai của bạn (Roleplay):</label>
            <select id="userRole">
                <option value="none">Chỉ nghe (Không đóng vai)</option>
                <option value="A">Đóng vai A</option>
                <option value="B">Đóng vai B</option>
            </select>
        </div>
    </div>

    <div class="input-section panel">
        <label>Nhập đoạn hội thoại (Ví dụ: A: Hello. B: Hi there!):</label>
        <textarea id="inputText" placeholder="A: Can you help me?&#10;B: Sure, what's the problem?">A: Good morning! How can I help you today?
B: I am looking forward to buying a new laptop.
A: Great! We have a few models that are on sale right now.</textarea>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="analyzeAndStart()"><i class="fa-solid fa-wand-magic-sparkles"></i> Phân tích & Bắt đầu</button>
        </div>
    </div>

    <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> Đang chuẩn bị bài học...</div>

    <div id="outputArea" class="main-layout" style="display: none;">
        <div class="panel">
            <div id="contextImageContainer">
                <img id="contextImage" src="" alt="Context">
            </div>
            <h3><i class="fa-solid fa-comments"></i> Hội thoại Roleplay</h3>
            <div id="dialogueDisplay"></div>
        </div>

        <div class="panel">
            <h3><i class="fa-solid fa-book-open"></i> Phân tích chi tiết</h3>
            <div id="detailsContent"></div>
        </div>
    </div>
</div>

<script>
    let voices = [];
    let conversationData = null;

    // 1. Khởi tạo danh sách giọng đọc
    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
        const select = document.getElementById('voiceSelect');
        select.innerHTML = '';
        
        // Lọc các giọng tiếng Anh
        const enVoices = voices.filter(v => v.lang.startsWith('en'));
        enVoices.forEach((voice, i) => {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `${voice.name} (${voice.lang})`;
            if(voice.name.includes('Google') && voice.lang === 'en-US') option.selected = true;
            select.appendChild(option);
        });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    // 2. Hàm phát âm
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const selectedVoiceIndex = document.getElementById('voiceSelect').value;
        const enVoices = voices.filter(v => v.lang.startsWith('en'));
        
        utterance.voice = enVoices[selectedVoiceIndex];
        utterance.rate = 0.9; // Đọc chậm một chút để dễ nghe
        if (callback) utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
    }

    // 3. Phân tích văn bản bằng Gemini
    async function analyzeAndStart() {
        const apiKey = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;

        if (!apiKey || !text) return alert("Vui lòng nhập đầy đủ API Key và Hội thoại");

        document.getElementById('loading').style.display = 'block';
        document.getElementById('outputArea').style.display = 'none';

        const prompt = `
        Analyze this conversation: "${text}"
        1. Create a context keyword for an image (e.g., "coffee shop", "office").
        2. Breakdown the conversation into lines with speaker.
        3. Identify key vocabulary (v1, v2...) and grammar structures (g1, g2...).
        
        Return STRICT JSON format:
        {
          "image_keyword": "keyword",
          "dialogue": [
            {"speaker": "A", "text": "...", "annotated": "text with <span class='hl-v' data-id='v1'>word</span>"}
          ],
          "vocabulary": [{"id": "v1", "word": "...", "ipa": "...", "meaning": "...", "example": "..."}],
          "grammar": [{"id": "g1", "name": "...", "formula": "...", "meaning": "...", "example": "..."}]
        }
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const result = await response.json();
            const rawJson = result.candidates[0].content.parts[0].text.replace(/```json|```/g, '');
            conversationData = JSON.parse(rawJson);
            
            renderEverything();
        } catch (e) {
            alert("Lỗi phân tích. Kiểm tra API Key!");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // 4. Hiển thị và chạy Roleplay
    function renderEverything() {
        document.getElementById('outputArea').style.display = 'grid';
        
        // Ảnh minh họa (Dùng Unsplash API miễn phí)
        const imgContainer = document.getElementById('contextImageContainer');
        const img = document.getElementById('contextImage');
        img.src = `https://source.unsplash.com/800x400/?${conversationData.image_keyword},england`;
        imgContainer.style.display = 'block';

        // Hội thoại
        const dialogueDisplay = document.getElementById('dialogueDisplay');
        dialogueDisplay.innerHTML = '';
        const userRole = document.getElementById('userRole').value;

        conversationData.dialogue.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = `dialogue-line ${line.speaker === userRole ? 'user-role' : ''}`;
            div.id = `line-${index}`;
            div.innerHTML = `
                <span class="speaker-name">${line.speaker}:</span>
                <span class="line-content">${line.annotated}</span>
            `;
            div.onclick = () => speak(line.text);
            dialogueDisplay.appendChild(div);
        });

        // Chi tiết từ vựng/ngữ pháp
        const details = document.getElementById('detailsContent');
        let html = '<h4>Từ vựng</h4>';
        conversationData.vocabulary.forEach(v => {
            html += `<div class="detail-card">
                <b>${v.word}</b> ${v.ipa} - ${v.meaning}
                <br><small>Ex: ${v.example}</small>
                <button onclick="speak('${v.word}')" style="border:none; background:none; cursor:pointer; color:var(--primary)">🔊</button>
            </div>`;
        });
        html += '<h4>Ngữ pháp</h4>';
        conversationData.grammar.forEach(g => {
            html += `<div class="detail-card">
                <b>${g.name}</b>: ${g.meaning}
                <br><span class="formula">${g.formula}</span>
                <br><small>Ex: ${g.example}</small>
                <button onclick="speak('${g.example.replace(/'/g, "\\'")}')" style="border:none; background:none; cursor:pointer; color:var(--primary)">🔊</button>
            </div>`;
        });
        details.innerHTML = html;

        // Bắt đầu Roleplay tự động
        runRoleplay(0);
    }

    function runRoleplay(index) {
        if (index >= conversationData.dialogue.length) return;

        const userRole = document.getElementById('userRole').value;
        const line = conversationData.dialogue[index];
        const element = document.getElementById(`line-${index}`);

        // Highlight dòng hiện tại
        document.querySelectorAll('.dialogue-line').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });

        if (line.speaker === userRole) {
            // Đến lượt User: Dừng lại chờ user click hoặc tự đọc sau khi chờ
            console.log("Your turn!");
            // Bạn có thể thêm tính năng thu âm ở đây nếu muốn nâng cấp thêm
        } else {
            // Đến lượt Máy: Đọc rồi tự động chuyển sang dòng tiếp theo
            speak(line.text, () => {
                setTimeout(() => runRoleplay(index + 1), 1000);
            });
        }
    }
</script>

</body>
</html>
